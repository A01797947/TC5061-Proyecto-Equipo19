[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tc5061_proyecto_equipo19"
version = "0.0.1"
description = "Proyecto MiBici: propuesta y base reproducible"
authors = [
  { name = "Equipo 19" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"

# Las versiones exactas están fijadas en requirements.txt.
dependencies = [
    "loguru",
    "matplotlib",
    "mlflow",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "typer",
]

[tool.ruff]
line-length = 99
src = ["tc5061_proyecto_equipo19"]
include = ["pyproject.toml", "tc5061_proyecto_equipo19/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tc5061_proyecto_equipo19"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"