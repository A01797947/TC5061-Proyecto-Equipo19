name: Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-y-seguridad:
    name: PyTest, secretos, Bandit y pip-audit (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-quality.txt
      - name: PyTest (sin DeepChecks)
        run: python -m pytest tests/ -m "not deepchecks" -q
      - name: Búsqueda de secretos
        run: python -m quality.secrets_scan
      - name: Bandit (severidad media y alta)
        run: python -m bandit -r tc5061_proyecto_equipo19 quality -ll
      - name: pip-audit de requirements.txt
        run: python -m pip_audit -r requirements.txt

  deepchecks:
    name: DeepChecks P1/P2/P3 con datos sintéticos (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar dependencias de DeepChecks
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-deepchecks.txt
      - name: Pruebas de DeepChecks
        run: python -m pytest tests/test_deepchecks.py -q
      - name: Validaciones demo
        run: |
          python -m quality.deepchecks_validation --problem P1 --demo
          python -m quality.deepchecks_validation --problem P2 --demo
          python -m quality.deepchecks_validation --problem P3 --demo
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-deepchecks
          path: reports/quality/
          if-no-files-found: warn
