name: MiBici - Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguridad:
    name: Tests, secretos, Bandit y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Instalar entorno de calidad
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-quality.txt
          python -m pip check
      - name: PyTest con datos sinteticos
        run: python -m pytest tests/ -m 'not deepchecks' -q
      - name: Detector local de secretos
        run: python -m quality.secrets_scan
      - name: Auditoria estatica Bandit
        run: python -m bandit -r tc5061_proyecto_equipo19 quality deployment -ll
      - name: Auditoria de dependencias
        run: python -m pip_audit -r requirements.txt

  deepchecks:
    name: DeepChecks con datos sinteticos (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-deepchecks.txt
      - name: Instalar entorno aislado
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-deepchecks.txt
          python -m pip check
      - name: Probar DeepChecks P1 P2 P3
        run: python -m pytest tests/test_deepchecks.py -q
