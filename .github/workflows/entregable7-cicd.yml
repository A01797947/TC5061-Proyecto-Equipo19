name: MiBici - Integracion, imagen y publicacion

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mibici-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas sin datos grandes e integridad de snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validar los SHA256 de los tres snapshots exportados
        run: python -m deployment.verify_snapshot
      - name: Ejecutar pruebas sin datasets masivos
        run: python -m pytest tests/ -m 'not deepchecks' -q
      - name: Escanear secretos en archivos versionados
        run: python -m quality.secrets_scan
      - name: Validar Docker Compose sin credenciales
        run: docker compose -f docker-compose.yml config --quiet

  imagen:
    name: Construir OCI y probar inferencias reales
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validar integridad del contexto del contenedor
        run: |
          test -s deployment/model_store/manifest.json
          test -s deployment/model_store/p1/model.skops
          test -s deployment/model_store/p2/model.skops
          test -s deployment/model_store/p3/model.skops
      - name: Construir imagen OCI
        run: docker build --pull -f Containerfile -t mibici-ci:latest .
      - name: Ejecutar smoke test P1 P2 P3
        shell: bash
        run: |
          set -euo pipefail
          CID=$(docker run --detach --env UVICORN_WORKERS=1 --publish 127.0.0.1:8000:8000 mibici-ci:latest)
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CID")" != true ]; then
              echo 'ERROR: el contenedor termino durante el arranque' >&2
              exit 1
            fi
            sleep 3
          done
          test "$ok" -eq 1 || { echo 'ERROR: no respondio /health' >&2; exit 1; }
          python3 -m deployment.smoke_test --base-url http://127.0.0.1:8000

  publicar:
    name: Publicar imagen aprobada en GHCR (no despliegue)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pruebas, imagen]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construir y publicar usando GITHUB_TOKEN
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}/mibici-api" | tr '[:upper:]' '[:lower:]')
          SHA_TAG="sha-${GITHUB_SHA:0:12}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull -f Containerfile -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
          echo "Publicado: ${IMAGE}:${SHA_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo 'La publicación de una imagen no constituye despliegue a producción.' >> "$GITHUB_STEP_SUMMARY"
