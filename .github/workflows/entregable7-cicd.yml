name: Entregable 7 - CI y entrega de imagen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas sin datos grandes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-serving.txt
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Ejecutar pruebas unitarias e integración simulada
        run: python -m pytest -q -m 'not deepchecks'
      - name: Verificar presencia y SHA256 de los 3 snapshots MLflow
        run: python -m deployment.verify_snapshot
      - name: Validar configuración Compose
        run: docker compose -f docker-compose.yml config --quiet

  imagen:
    name: Construir imagen + smoke test real
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar snapshots antes de build
        shell: bash
        run: |
          test -s deployment/model_store/manifest.json || { echo 'Faltan snapshots versionados'; exit 1; }
          for p in p1 p2 p3; do
            test -s "deployment/model_store/$p/MLmodel" || exit 1
          done
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir imagen local para integración
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: mibici-equipo19-api:ci
      - name: Iniciar API y verificar health y predicciones P1/P2/P3
        shell: bash
        run: |
          docker run -d --name mibici-ci -p 127.0.0.1:8000:8000 mibici-equipo19-api:ci
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          python -m deployment.smoke_test --base-url http://127.0.0.1:8000
      - name: Logs ante fallo
        if: failure()
        run: docker logs mibici-ci || true
      - name: Finalizar contenedor
        if: always()
        run: docker rm -f mibici-ci || true
      - name: Publicar imagen en GHCR solo al subir a main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          IMAGE="ghcr.io/${REPO,,}/mibici-api"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag mibici-equipo19-api:ci "$IMAGE:latest"
          docker tag mibici-equipo19-api:ci "$IMAGE:${SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${SHA}"
